name: F3.C Qt filters

on:
  push:
    branches:
      - feat/f3-c-qt-filters

permissions:
  contents: read

jobs:
  focal-python:
    name: F3.C focal / Python ${{ matrix.python-version }}
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONFAULTHANDLER: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Ubuntu Qt runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libopengl0 libfontconfig1 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-util1 libxcb-xinerama0 libxcb-xkb1

      - name: Install focal environment
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          if [ "${{ matrix.python-version }}" = "3.12" ]; then
            python -m pip install -c constraints-python312.txt -e '.[dev,qt]'
          else
            python -m pip install -e '.[dev,qt]'
          fi

      - name: F3.C pure + Qt suite
        run: python -m unittest -v tests.test_filters tests.test_qt_filters

      - name: Record focal environment
        run: |
          echo "python=$(python --version 2>&1)"
          echo "pyside6=$(python -c 'import PySide6; print(PySide6.__version__)')"
          echo "pandas=$(python -c 'import pandas; print(pandas.__version__)')"
          echo "numpy=$(python -c 'import numpy; print(numpy.__version__)')"

  verify:
    name: F3.C regression / structural / build / smokes
    needs: focal-python
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONFAULTHANDLER: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify baseline ancestry and clean checkout
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git merge-base HEAD e949e766e0d2c46099d128ac4839bf615adaa8b8)" = \
            "e949e766e0d2c46099d128ac4839bf615adaa8b8"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD
          git rev-parse HEAD^{tree}

      - name: Install Ubuntu GUI runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb python3-tk libegl1 libgl1 libopengl0 libfontconfig1 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-util1 libxcb-xinerama0 libxcb-xkb1

      - name: Install development environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints-python312.txt -e '.[dev,qt]'

      - name: F3.C focal
        run: |
          python -m unittest -v tests.test_filters tests.test_qt_filters \
            | tee /tmp/f3c-tests.txt

      - name: S-200K-FILTER structural test
        run: |
          python -m unittest -v tests.test_filter_structural \
            | tee /tmp/f3c-structural.txt

      - name: F3.B regression
        run: python -m unittest -v tests.test_table tests.test_qt_table

      - name: F3.A regression
        run: python -m unittest -v tests.test_qt_foundation

      - name: Historical/core regression under Xvfb
        env:
          QT_QPA_PLATFORM: xcb
        run: |
          xvfb-run -a python -m unittest -v \
            tests.test_analysis_plots \
            tests.test_application \
            tests.test_data_state \
            tests.test_export_callbacks \
            tests.test_exports \
            tests.test_gui \
            tests.test_identity \
            tests.test_jobs

      - name: Ruff focal
        run: |
          python -m ruff check \
            src/csv_analyzer/qt_app/filter_dialog.py \
            src/csv_analyzer/qt_app/coordinator.py \
            src/csv_analyzer/qt_app/table_view.py \
            tests/test_filters.py \
            tests/test_qt_filters.py \
            tests/test_filter_structural.py
          python -m ruff format --check \
            src/csv_analyzer/qt_app/filter_dialog.py \
            src/csv_analyzer/qt_app/coordinator.py \
            src/csv_analyzer/qt_app/table_view.py \
            tests/test_filters.py \
            tests/test_qt_filters.py \
            tests/test_filter_structural.py

      - name: Build wheel and sdist
        run: |
          mkdir -p dist
          python -m build
          sha256sum dist/* | tee dist/SHA256SUMS

      - name: Clean base install without Qt extra
        shell: bash
        run: |
          set -euxo pipefail
          WHEEL="$(readlink -f "$(ls dist/*.whl)")"
          python -m venv /tmp/varia-f3c-base
          /tmp/varia-f3c-base/bin/python -m pip install --upgrade pip
          /tmp/varia-f3c-base/bin/pip install \
            -c "$GITHUB_WORKSPACE/constraints-python312.txt" "$WHEEL"
          /tmp/varia-f3c-base/bin/pip check
          /tmp/varia-f3c-base/bin/python - <<'PY' | tee dist/base-environment.txt
          import importlib.util
          assert importlib.util.find_spec("PySide6") is None
          import csv_analyzer.analysis
          print("base_pyside6=ABSENT")
          print("filter_core_import=PASS")
          PY

      - name: CTk coexistence smoke
        env:
          QT_QPA_PLATFORM: xcb
        run: |
          mkdir -p /tmp/varia-f3c-runtime
          cd /tmp/varia-f3c-runtime
          env -u PYTHONPATH /tmp/varia-f3c-base/bin/varia-studio --help
          env -u PYTHONPATH xvfb-run -a /tmp/varia-f3c-base/bin/python - <<'PY' \
            | tee "$GITHUB_WORKSPACE/dist/ctk-smoke.txt"
          from csv_analyzer.app import Application
          app = Application()
          app.update_idletasks()
          print("ctk_coexistence=PASS")
          app.close()
          PY

      - name: Clean Qt install from same wheel
        shell: bash
        run: |
          set -euxo pipefail
          WHEEL="$(readlink -f "$(ls dist/*.whl)")"
          python -m venv /tmp/varia-f3c-qt
          /tmp/varia-f3c-qt/bin/python -m pip install --upgrade pip
          /tmp/varia-f3c-qt/bin/pip install \
            -c "$GITHUB_WORKSPACE/constraints-python312.txt" "${WHEEL}[qt]"
          /tmp/varia-f3c-qt/bin/pip check

      - name: Installed Qt filter/table smoke
        shell: bash
        run: |
          cd /tmp/varia-f3c-runtime
          cat > filter-smoke.csv <<'EOF'
          big,text
          9007199254740993,Alpha
          2,beta
          EOF
          env -u PYTHONPATH QT_QPA_PLATFORM=offscreen \
            /tmp/varia-f3c-qt/bin/python - <<'PY' | tee "$GITHUB_WORKSPACE/dist/qt-filter-smoke.txt"
          from pathlib import Path
          from PySide6.QtCore import QEventLoop, QTimer
          from csv_analyzer.qt_app.bootstrap import create_application
          from csv_analyzer.qt_app.coordinator import Lifecycle
          from csv_analyzer.state import FilterRule
          from csv_analyzer.table import TableScope

          def pump(predicate):
              if predicate():
                  return
              loop = QEventLoop()
              timer = QTimer()
              timer.setInterval(2)
              timer.timeout.connect(lambda: loop.quit() if predicate() else None)
              timer.start()
              QTimer.singleShot(5000, loop.quit)
              loop.exec()
              assert predicate()

          app, coordinator, shell = create_application()
          coordinator.start()
          shell.show()
          coordinator.load_path(Path("filter-smoke.csv"))
          pump(lambda: coordinator.table_controller.model.rowCount() == 2)
          assert shell.table_view.filter_button.isEnabled()
          assert coordinator.apply_filters((FilterRule("big", lower=9007199254740993),))
          pump(lambda: coordinator.runner.activity.physical == 0)
          assert coordinator.state.selected_count == 1
          assert coordinator.table_controller.model.rowCount() == 1
          assert shell.table_view.filter_button.text() == "Filters · 1"
          coordinator.table_controller.set_scope(TableScope.ALL)
          pump(lambda: coordinator.runner.activity.physical == 0)
          assert coordinator.table_controller.model.rowCount() == 2
          assert coordinator.apply_filters(())
          assert coordinator.state.mask is None
          assert shell.table_view.filter_button.text() == "Filters · none"
          shell.close()
          pump(lambda: coordinator.lifecycle is Lifecycle.CLOSED and not shell.isVisible())
          print("qt_filter_table_smoke=PASS")
          print("exact_bigint_filter=PASS")
          print("lifecycle=CLOSED")
          PY

      - name: Record evidence
        shell: bash
        run: |
          cp /tmp/f3c-tests.txt dist/f3c-tests.txt
          cp /tmp/f3c-structural.txt dist/f3c-structural.txt
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "tree=$(git rev-parse HEAD^{tree})"
            echo "baseline=e949e766e0d2c46099d128ac4839bf615adaa8b8"
            echo "python=$(python --version 2>&1)"
            echo "pyside6=$(python -c 'import PySide6; print(PySide6.__version__)')"
            echo "pandas=$(python -c 'import pandas; print(pandas.__version__)')"
            echo "numpy=$(python -c 'import numpy; print(numpy.__version__)')"
          } | tee dist/f3c-environment.txt

      - uses: actions/upload-artifact@v4
        with:
          name: f3-c-evidence
          path: dist/*
          if-no-files-found: error
