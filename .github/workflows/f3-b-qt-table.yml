name: F3.B Qt table

on:
  push:
    branches:
      - feat/f3-b-qt-table

permissions:
  contents: read

jobs:
  focal-python:
    name: F3.B focal / Python ${{ matrix.python-version }}
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONFAULTHANDLER: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Ubuntu Qt runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y             libegl1 libgl1 libopengl0 libfontconfig1             libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0             libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0             libxcb-util1 libxcb-xinerama0 libxcb-xkb1

      - name: Install focal environment
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          if [ "${{ matrix.python-version }}" = "3.12" ]; then
            python -m pip install -c constraints-python312.txt -e '.[dev,qt]'
          else
            python -m pip install -e '.[dev,qt]'
          fi

      - name: F3.B pure + Qt suite
        run: python -m unittest -v tests.test_table tests.test_qt_table

      - name: Record focal environment
        run: |
          echo "python=$(python --version 2>&1)"
          echo "pyside6=$(python -c 'import PySide6; print(PySide6.__version__)')"
          echo "pandas=$(python -c 'import pandas; print(pandas.__version__)')"
          echo "numpy=$(python -c 'import numpy; print(numpy.__version__)')"

  verify:
    name: F3.B regression / structural / build / smokes
    needs: focal-python
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONFAULTHANDLER: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify baseline ancestry and clean checkout
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git merge-base HEAD ffc291cc6bbd2735841120e1fc8258b41f53c665)" =             "ffc291cc6bbd2735841120e1fc8258b41f53c665"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD
          git rev-parse HEAD^{tree}

      - name: Install Ubuntu GUI runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y             xvfb python3-tk libegl1 libgl1 libopengl0 libfontconfig1             libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0             libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0             libxcb-util1 libxcb-xinerama0 libxcb-xkb1

      - name: Install development environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints-python312.txt -e '.[dev,qt]'

      - name: F3.B pure + Qt
        run: |
          python -m unittest -v tests.test_table tests.test_qt_table             | tee /tmp/f3b-tests.txt

      - name: S-200K-TABLE structural test
        run: |
          python -m unittest -v tests.test_table_structural             | tee /tmp/f3b-structural.txt

      - name: F3.A regression
        run: python -m unittest -v tests.test_qt_foundation

      - name: F3.A load-replacement native stability gate
        shell: bash
        run: |
          set -euxo pipefail
          for iteration in $(seq 1 10); do
            echo "f3a_load_replacement_iteration=$iteration"
            python -m unittest -v               tests.test_qt_foundation.CoordinatorContractTests.test_load_replacement_waits_for_physical_predecessor
          done

      - name: F3.A full-suite Qt lifetime stability gate
        shell: bash
        run: |
          set -euxo pipefail
          for iteration in $(seq 1 3); do
            echo "f3a_full_suite_iteration=$iteration"
            python -m unittest -v tests.test_qt_foundation
          done

      - name: Historical/core regression under Xvfb
        env:
          QT_QPA_PLATFORM: xcb
        run: |
          xvfb-run -a python -m unittest -v             tests.test_analysis_plots             tests.test_application             tests.test_data_state             tests.test_export_callbacks             tests.test_exports             tests.test_gui             tests.test_identity             tests.test_jobs

      - name: Ruff
        run: |
          python -m ruff check src tests tools
          python -m ruff format --check             src/csv_analyzer/table.py             src/csv_analyzer/qt_app             tests/test_table.py             tests/test_qt_table.py             tests/test_table_structural.py             tools/f3a_qt_close_probe.py

      - name: Build wheel and sdist
        run: |
          mkdir -p dist
          python -m build
          sha256sum dist/* | tee dist/SHA256SUMS

      - name: Clean base install without Qt extra
        shell: bash
        run: |
          set -euxo pipefail
          WHEEL="$(readlink -f "$(ls dist/*.whl)")"
          python -m venv /tmp/varia-f3b-base
          /tmp/varia-f3b-base/bin/python -m pip install --upgrade pip
          /tmp/varia-f3b-base/bin/pip install             -c "$GITHUB_WORKSPACE/constraints-python312.txt" "$WHEEL"
          /tmp/varia-f3b-base/bin/pip check
          /tmp/varia-f3b-base/bin/python - <<'PY' | tee dist/base-environment.txt
          import importlib.util
          assert importlib.util.find_spec("PySide6") is None
          import csv_analyzer.table
          print("base_pyside6=ABSENT")
          print("table_core_import=PASS")
          PY

      - name: CTk coexistence smoke
        env:
          QT_QPA_PLATFORM: xcb
        run: |
          mkdir -p /tmp/varia-f3b-runtime
          cd /tmp/varia-f3b-runtime
          env -u PYTHONPATH /tmp/varia-f3b-base/bin/varia-studio --help
          env -u PYTHONPATH xvfb-run -a /tmp/varia-f3b-base/bin/python - <<'PY'             | tee "$GITHUB_WORKSPACE/dist/ctk-smoke.txt"
          from csv_analyzer.app import Application
          app = Application()
          app.update_idletasks()
          print("ctk_coexistence=PASS")
          app.close()
          PY

      - name: Clean Qt install from same wheel
        shell: bash
        run: |
          set -euxo pipefail
          WHEEL="$(readlink -f "$(ls dist/*.whl)")"
          python -m venv /tmp/varia-f3b-qt
          /tmp/varia-f3b-qt/bin/python -m pip install --upgrade pip
          /tmp/varia-f3b-qt/bin/pip install             -c "$GITHUB_WORKSPACE/constraints-python312.txt" "${WHEEL}[qt]"
          /tmp/varia-f3b-qt/bin/pip check

      - name: Installed Qt table smoke
        shell: bash
        run: |
          cd /tmp/varia-f3b-runtime
          cat > table-smoke.csv <<'EOF'
          big,text
          9007199254740993,Alpha
          2,beta
          EOF
          env -u PYTHONPATH QT_QPA_PLATFORM=offscreen             /tmp/varia-f3b-qt/bin/python - <<'PY' | tee "$GITHUB_WORKSPACE/dist/qt-table-smoke.txt"
          from pathlib import Path
          from PySide6.QtCore import QEventLoop, QTimer
          from csv_analyzer.qt_app.bootstrap import create_application
          from csv_analyzer.qt_app.coordinator import Lifecycle

          app, coordinator, shell = create_application()
          coordinator.start()
          shell.show()
          coordinator.load_path(Path("table-smoke.csv"))
          loop = QEventLoop()
          timer = QTimer()
          timer.setInterval(2)
          timer.timeout.connect(
              lambda: loop.quit() if coordinator.table_controller.model.rowCount() == 2 else None
          )
          timer.start()
          QTimer.singleShot(5000, loop.quit)
          loop.exec()
          model = coordinator.table_controller.model
          assert model.rowCount() == 2
          assert model.columnCount() == 3
          assert model.source_row_id_at(1) == 2
          assert model.copy_text([0], [1]).strip() == "9007199254740993"
          assert shell.table_view.table.indexWidget(model.index(0, 1)) is None
          shell.close()
          close_loop = QEventLoop()
          close_timer = QTimer()
          close_timer.setInterval(2)
          close_timer.timeout.connect(
              lambda: close_loop.quit()
              if coordinator.lifecycle is Lifecycle.CLOSED and not shell.isVisible()
              else None
          )
          close_timer.start()
          QTimer.singleShot(5000, close_loop.quit)
          close_loop.exec()
          assert coordinator.lifecycle is Lifecycle.CLOSED
          print("qt_table_smoke=PASS")
          print("exact_bigint_copy=PASS")
          print("no_cell_widgets=PASS")
          print("lifecycle=CLOSED")
          PY

      - name: Record evidence
        shell: bash
        run: |
          cp /tmp/f3b-tests.txt dist/f3b-tests.txt
          cp /tmp/f3b-structural.txt dist/f3b-structural.txt
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "tree=$(git rev-parse HEAD^{tree})"
            echo "baseline=ffc291cc6bbd2735841120e1fc8258b41f53c665"
            echo "python=$(python --version 2>&1)"
            echo "pyside6=$(python -c 'import PySide6; print(PySide6.__version__)')"
            echo "pandas=$(python -c 'import pandas; print(pandas.__version__)')"
            echo "numpy=$(python -c 'import numpy; print(numpy.__version__)')"
          } | tee dist/f3b-environment.txt

      - uses: actions/upload-artifact@v4
        with:
          name: f3-b-evidence
          path: dist/*
          if-no-files-found: error
