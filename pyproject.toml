[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csv-analyzer-desktop"
version = "2.1.0"
description = "Varia Studio: a desktop workspace for exploring CSV and scientific DAT datasets"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2,<4",
    "numpy>=1.26,<3",
    "matplotlib>=3.8,<4",
    "PySide6>=6.11.3,<6.13",
]

[project.optional-dependencies]
qt = []
legacy = [
    "customtkinter>=5.2,<6",
]
dev = [
    "ruff>=0.8",
    "build>=1.2",
    "tomli>=2; python_version < '3.11'",
]

[project.scripts]
varia-studio = "csv_analyzer.qt_app:main"
csv-analyzer = "csv_analyzer.qt_app:main"
varia-studio-qt = "csv_analyzer.qt_app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
